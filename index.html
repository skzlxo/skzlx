    <style>
        * {
            box-sizing: border-box;

        body {
            margin: 0;

            color: #ffffff;

            min-height: 100vh;
            overflow: hidden;
            background-color: #0b0b0b;
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes rainbowCycle {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }


        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            z-index: 1;
            margin-bottom: 30px;
            height: 85vh;
            overflow-y: auto;
            perspective: 1200px;
        }
        
        .container::-webkit-scrollbar { display: none; }
        .container { -ms-overflow-style: none; scrollbar-width: none; }


        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background-color: #111;
            object-fit: cover;
            padding: 4px;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% auto;
            animation: rainbowCycle 4s linear infinite;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .profile-pic:hover { transform: scale(1.05); }


        h1 {
            margin: 0 0 20px 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
            background: linear-gradient(90deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowCycle 4s linear infinite, textGlitch 8s infinite;
        }

        @keyframes textGlitch {
            0%, 96%, 100% { transform: none; text-shadow: none; }
            97% { text-shadow: 2px 0 rgba(0,255,255,0.7), -2px 0 rgba(255,0,255,0.7); transform: skewX(8deg); }
            98% { text-shadow: -2px 0 rgba(0,255,255,0.7), 2px 0 rgba(255,0,255,0.7); transform: skewX(-8deg); }
            99% { text-shadow: none; transform: none; }
        }


        .bio-box {
            background: rgba(0, 140, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 24px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid rgba(0, 140, 255, 0.35);
            font-size: 14px;
            font-weight: 400;
            line-height: 1.4;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            will-change: transform;
        }


        .link-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            text-decoration: none;
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            will-change: transform;
        }

        .link-btn i {
            position: absolute;
            left: 20px;
            font-size: 20px;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }


        .cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 12px;
            height: 12px;
            background: #00ffff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            transition: width 0.2s, height 0.2s, background-color 0.5s, box-shadow 0.5s;
        }
        
        .cursor-trail {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }


        .music-controls {

<body>

    <div class="container">

        <h1>skzlx</h1>

        <div class="bio-box" id="bioBoxText">
            The one and only skzlx. 
        </div>

        <a href="https://www.youtube.com/@skzlx" class="link-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-youtube"></i> YouTube: skzlx
        </a>
        
        <a href="https://www.instagram.com/skzlxw/" class="link-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-instagram"></i> Instagram: skzlxw
        </a>
        
        <div class="link-btn">
            <i class="fa-brands fa-discord"></i> Discord: skzlxbtw
        </div>
        
        <div class="link-btn">
            <i class="fa-brands fa-snapchat"></i> Snapchat: skzlxo
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="music-controls" onclick="toggleMusic()">
        <i class="fa-solid fa-music" id="musicIcon"></i>
        <span id="musicText">Tap anywhere to play</span>
    </div>

    <div class="footer-credit">&copy; Copyright SKZLX Foundation. All rights reserved. K65J0P9HHJ.</div>

    <script>

        const coords = { x: 0, y: 0 };
        const numTrails = 12; 
        const trails = [];
        
        const cursorDot = document.createElement('div');
        cursorDot.className = 'cursor-dot';
        document.body.appendChild(cursorDot);

        for (let i = 0; i < numTrails; i++) {
            const trail = document.createElement('div');
            trail.className = 'cursor-trail';
            document.body.appendChild(trail);
            trails.push({ el: trail, x: 0, y: 0 });
        }

        window.addEventListener('mousemove', (e) => {
            coords.x = e.clientX;
            coords.y = e.clientY;
            cursorDot.style.left = coords.x + 'px';
            cursorDot.style.top = coords.y + 'px';
        });

        function animateTrails() {
            let x = coords.x;
            let y = coords.y;

            trails.forEach((trail, index) => {
                const nextTrail = trails[index + 1] || trails[0];
                trail.x = x;
                trail.y = y;
                trail.el.style.left = x + 'px';
                trail.el.style.top = y + 'px';
                trail.el.style.transform = `translate(-50%, -50%) scale(${(numTrails - index) / numTrails})`;
                x += (nextTrail.x - x) * 0.45;
                y += (nextTrail.y - y) * 0.45;
            });

            requestAnimationFrame(animateTrails);
        }
        animateTrails();

        document.querySelectorAll('a, .profile-pic, .music-controls, .link-btn').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorDot.style.width = '24px';
                cursorDot.style.height = '24px';
            });
            el.addEventListener('mouseleave', () => {
                cursorDot.style.width = '12px';
                cursorDot.style.height = '12px';
            });
        });


        const tiltElements = document.querySelectorAll('.bio-box, .link-btn');
        
        tiltElements.forEach(el => {
            el.style.transformStyle = 'preserve-3d';
            
            el.addEventListener('mousemove', (e) => {
                const rect = el.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -12; 
                const rotateY = ((x - centerX) / centerX) * 12;
                
                el.style.transition = 'transform 0.05s linear';
                el.style.transform = `perspective(1000px) scale(1.04) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            el.addEventListener('mouseleave', () => {
                el.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                el.style.transform = `perspective(1000px) scale(1) rotateX(0deg) rotateY(0deg)`;
            });
        });

        const music = document.getElementById("bgMusic");
        const musicText = document.getElementById("musicText");
        const musicIcon = document.getElementById("musicIcon");
        let isPlaying = false;

        document.body.addEventListener('click', function(e) {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicText.innerText = "Playing";
                    musicIcon.classList.remove('fa-music');
                    musicIcon.classList.add('fa-pause');
                }).catch(err => console.log("Audio autoplay restricted:", err));
            }
        }, { once: true }); 

        function toggleMusic() {
            event.stopPropagation(); 
            if (isPlaying) {
                music.pause();
                isPlaying = false;
                musicText.innerText = "Paused";
                musicIcon.classList.remove('fa-pause');
                musicIcon.classList.add('fa-play');
            } else {
                music.play().then(() => {
                    isPlaying = true;
                    musicText.innerText = "Playing";
                    musicIcon.classList.remove('fa-play');
                    musicIcon.classList.add('fa-pause');
                });
            }
        }
    </script>
